/* ---------- Actions ---------- */
const A={
  tab:el=>go(el.dataset.tab),
  settings:()=>openSettings(),
  closeSheet:()=>closeSheet(),
  toggleMission:()=>{const D=ensureDay(todayKey());D.mission=!D.mission;save();render();if(D.mission)toast('Mission complete. Nice one.')},
  roughNight:()=>{const D=ensureDay(todayKey());D.roughNight=!D.roughNight;save();render();if(D.roughNight)toast('Swapped to a walk. Look after yourself.')},
  stepsAdd:()=>{const D=ensureDay(todayKey());D.steps+=1000;save();render()},
  stepsSet:()=>{const D=getDay(todayKey());openSheet(`<form data-form="steps" class="stack" autocomplete="off"><div class="sec-title">Today's steps</div><p class="small muted">Enter today's total from the Health app on your iPhone.</p><div class="field"><label for="st_v">Total steps</label><input class="input" id="st_v" name="steps" inputmode="numeric" value="${D.steps||''}" placeholder="e.g. 8500"></div><button class="btn primary block" type="submit">Save</button></form>`)},
  water:el=>{const D=ensureDay(todayKey());D.waterMl=Math.max(0,D.waterMl+(+el.dataset.ml));save();render()},
  crave:()=>{SF={step:'ask',reason:null};if(tab!=='snack')go('snack');else render()},
  reason:el=>{SF.step='suggest';SF.reason=el.dataset.r;breath=null;render()},
  snackReset:()=>{SF={step:'start'};breath=null;render()},
  haveSnack:el=>{const x=SNACKS.find(s=>s.id===el.dataset.id);const r=el.dataset.reason;logSnack(r,'ate',x.name,x.kcal,x.p);
    if(r==='planned'){toast(`${x.name} added to today's snacks`);render();return}
    SF={step:'done',msg:`${x.name} added to today's food diary (~${x.kcal} kcal, ~${x.p}g protein). Enjoy it. Plate it, sit down, no guilt.`};breath=null;render()},
  didAct:el=>{logSnack(SF.reason,'redirected',el.dataset.act,0,0);SF={step:'done',msg:`Nice. "${el.dataset.act}" logged. If you're properly hungry in 20 minutes, have a filling snack. That's fine too.`};breath=null;render()},
  otherSnack:()=>{openSheet(`<form data-form="otherSnack" class="stack" autocomplete="off"><div class="sec-title">What did you have?</div><p class="small muted">No judgement. Logging it is the habit that matters.</p><div class="field"><label for="os_n">Snack</label><input class="input" id="os_n" name="name" required maxlength="80" placeholder="e.g. 3 chocolate digestives"></div><div class="grid2"><div class="field"><label for="os_k">Calories (est.)</label><input class="input" id="os_k" name="kcal" inputmode="numeric" placeholder="kcal"></div><div class="field"><label for="os_p">Protein (g)</label><input class="input" id="os_p" name="protein" inputmode="decimal" placeholder="g"></div></div><button class="btn primary block" type="submit">Log it</button></form>`)},
  delSnack:el=>{const x=S.snacks.find(s=>s.id===el.dataset.id);S.snacks=S.snacks.filter(s=>s.id!==el.dataset.id);save();render();toast(x&&x.foodId?'Removed from history. The diary entry stays; edit it in Food.':'Removed')},
  breath:()=>{if(breath&&!breath.done){breath=null;render();return}initAudio();breath={start:Date.now(),ph:-1};render();tick()},
  foodDay:el=>{const d=+el.dataset.d;const cur=foodDate||todayKey();foodDate=d===0?null:addDays(cur,d);if(foodDate&&foodDate>=todayKey())foodDate=null;render(true)},
  addFood:el=>foodSheet({meal:el.dataset.meal}),
  editFood:el=>{const D=getDay(foodDate||todayKey());const f=D.food.find(x=>x.id===el.dataset.id);if(f)foodSheet(f)},
  delFood:el=>{const k=foodDate||todayKey();const D=ensureDay(k);D.food=D.food.filter(f=>f.id!==el.dataset.id);save();closeSheet();render();toast('Entry deleted')},
  quickAdd:el=>{if(el.dataset.fav){const f=S.favourites.find(x=>x.id===el.dataset.fav);if(f)foodSheet({meal:f.meal,name:f.name,kcal:f.kcal,protein:f.protein,ing:f.ing})}else{const ex=(EXAMPLES[el.dataset.meal]||[]).find(x=>x[0]===el.dataset.name);foodSheet({meal:el.dataset.meal,name:el.dataset.name,kcal:+el.dataset.kcal,protein:+el.dataset.p,ing:ex&&ex[3]})}},
  delFav:el=>{S.favourites=S.favourites.filter(f=>f.id!==el.dataset.id);save();render()},
  startWorkout:el=>{initAudio();P={w:el.dataset.w,items:itemsFor(el.dataset.w),round:1,idx:0,rounds:S.settings.rounds,start:Date.now(),completedRounds:0,rest:null,timer:null};lockScreen();playerRender()},
  skipWorkout:el=>{const w=el.dataset.w;openSheet(`<div class="sec-title">Skip ${WORKOUTS[w].name}?</div><p class="small muted">Totally fine. Logging a skip keeps your record honest and helps the weekly review. Why are you skipping?</p><div class="stack" style="gap:8px">${['Rough night with the baby','No time today','Feeling sore','Feeling unwell','Did something else instead'].map(r=>`<button class="opt" data-action="confirmSkip" data-w="${w}" data-r="${r}"><b>${r}</b></button>`).join('')}</div>`)},
  confirmSkip:el=>{S.workouts.push({id:uid(),ts:Date.now(),date:todayKey(),type:el.dataset.w,label:WORKOUTS[el.dataset.w].name,status:'skipped',note:el.dataset.r});save();closeSheet();render();toast('Skipped. Back at it next time.')},
  startTimer:()=>{P.timer={end:Date.now()+P.items[P.idx].secs*1000};playerRender()},
  exDone:()=>{advance();if(P&&!P.finished)playerRender()},
  restSkip:()=>{P.rest=null;playerRender()},
  restAdd:()=>{if(P.rest)P.rest.end+=15000;tick()},
  endAsk:()=>{P.confirmEnd=true;playerRender()},
  endCancel:()=>{P.confirmEnd=false;playerRender()},
  endSave:()=>{P.confirmEnd=false;P.completedRounds=Math.max(P.round-1,P.idx>0?1:0)||1;finishWorkout(false)},
  endDiscard:()=>{P=null;unlockScreen();playerRender();render()},
  closePlayer:()=>{P=null;unlockScreen();playerRender();render()},
  setRounds:el=>{S.settings.rounds=+el.dataset.n;save();render()},
  setFreq:el=>{S.settings.workoutsPerWeek=+el.dataset.n;save();render()},
  logAct:el=>{const a=el.dataset.a;openSheet(`<form data-form="activity" class="stack" autocomplete="off"><div class="sec-title">${a?'Log a walk':'Log activity'}</div>
    <div class="field"><label for="a_type">Activity</label><select class="input" id="a_type" name="type">${ACTIVITIES.map(x=>`<option ${x===(a||'Five-a-side football')?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label for="a_min">Minutes</label><input class="input" id="a_min" name="minutes" inputmode="numeric" value="30" required></div><div class="field"><label for="a_date">Date</label><input class="input" type="date" id="a_date" name="date" value="${todayKey()}" max="${todayKey()}"></div></div>
    <div class="field"><label for="a_note">Note (optional)</label><input class="input" id="a_note" name="note" maxlength="80" placeholder="e.g. pram walk round the village"></div>
    <button class="btn primary block" type="submit">Save</button></form>`)},
  delWorkout:el=>{S.workouts=S.workouts.filter(w=>w.id!==el.dataset.id);save();render();toast('Removed')},
  delWeight:el=>{S.weights=S.weights.filter(w=>w.id!==el.dataset.id);recalcMilestones();save();render();toast('Weigh-in removed')},
  openReview:()=>openReview(),
  healthImport:()=>healthSheet(),
  healthHelp:()=>healthHelp(),
  checkin:()=>checkinSheet(),
  nudges:()=>nudgesSheet(),
  cloud:()=>cloudSheet(),
  cloudSyncNow:async()=>{const n=await pullHealth(false);const ok=await pushBackup();if(n>=0&&ok)toast(n?`Synced. Garmin data for ${n} day${n===1?'':'s'}.`:'Synced. Backup saved.');render();if(!$('#sheet').hidden)cloudSheet()},
  cloudRestore:async el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to replace this phone\'s data';return}
    try{const d=await rpc('dadmode_load_backup',{p_sync:S.cloud.code});if(!d||!d.settings){toast('No cloud backup found yet');return}const keep=S.cloud;S=migrate(d);S.cloud=keep;saveLocal();closeSheet();render(true);toast('Restored from cloud')}catch(e){toast('Restore failed: '+(e.message||e))}},
  cloudOff:()=>{S.cloud={};saveLocal();closeSheet();render();toast('Cloud sync turned off')},
  copyField:el=>{const t=document.getElementById(el.dataset.for);copyStr(t.value,t)},
  copyText:el=>{const t=document.getElementById(el.dataset.for);copyStr(t.textContent,null)},
  foodMode:el=>{foodMode=el.dataset.m;if(tab!=='food')go('food');else render(true)},
  planWeek:el=>{planWeek=+el.dataset.n;render()},
  planAuto:()=>{const ws=planWs(),P7=planFor7(ws);let n=0;['breakfast','lunch','dinner'].forEach(m=>{const lib=mealLibrary(m);if(!lib.length)return;let i=0;
    for(let d=0;d<7;d++){const dk2=addDays(ws,d);P7[dk2]=P7[dk2]||{};if(!P7[dk2][m]){const o=lib[(i+d)%lib.length];P7[dk2][m]={name:o.name,kcal:o.kcal,protein:o.protein,ing:o.ing};n++}}i++});
    save();render();toast(n?`Filled ${n} meals. Swap any you don't fancy.`:'Every slot is already planned')},
  planClear:el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to clear';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Clear week'}},3000);return}delete S.plans[planWs()];save();render();toast('Week cleared')},
  shopCopy:()=>{const ws=planWs(),L=shopList(ws),chk=S.shopChecked[ws]||{};const lines=[...L.items.map(x=>x[0]),...L.extra].filter(n=>!chk[n]);if(!lines.length){toast('Nothing left to buy');return}copyStr(`Shopping list (week of ${fmtDate(ws)})\n`+lines.map(x=>'- '+x).join('\n'),null)},
  shopReset:()=>{S.shopChecked[planWs()]={};save();render()},
  shopDel:el=>{const ws=planWs();S.shopExtra[ws]=(S.shopExtra[ws]||[]).filter(x=>x!==el.dataset.name);save();render()},
  logPlanned:el=>{const pt=plannedToday(todayKey())[el.dataset.meal];if(pt)foodSheet({meal:el.dataset.meal,name:pt.name,kcal:pt.kcal,protein:pt.protein,ing:pt.ing})},
  scan:()=>scanSheet(),
  scanRetry:()=>startCamera(),
  scanRecent:el=>{const x=S.scans.find(y=>y.code===el.dataset.code);if(x)productSheet(x)},
  delWaist:el=>{S.waist=S.waist.filter(w=>w.id!==el.dataset.id);save();render();toast('Measurement removed')},
  photoView:async el=>{const list=await photoAll()||[];const p=list.find(x=>x.id===el.dataset.id);if(!p)return;openSheet(`<div class="row between"><div class="sec-title">${fmtDay(p.date)}</div></div><img src="${p.data}" alt="Progress photo" style="width:100%;border-radius:14px"><button class="btn danger block" data-action="photoDelete" data-id="${p.id}">Delete photo</button>`)},
  photoDelete:async el=>{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to delete';return}await photoDel(el.dataset.id);closeSheet();render();toast('Photo deleted')},
  skipRundown:()=>{const D=ensureDay(todayKey());D.rundownSkip=true;save();render()},
  toggleRundown:()=>{rundownOpen=!rundownOpen;render()},
  swapWalk:()=>{const D=ensureDay(todayKey());D.roughNight=true;save();render();toast('Swapped to a walk. Good call.')},
  startToday:()=>{const p=planFor(todayKey(),getDay(todayKey()));if(p.kind==='strength')A.startWorkout({dataset:{w:p.w}})},
  healthPaste:()=>{const fallback=()=>{const t=$('#hl_txt');if(t){t.focus();}toast('Paste the copied line into the box, then tap Import')};
    try{if(!navigator.clipboard||!navigator.clipboard.readText){fallback();return}
      navigator.clipboard.readText().then(txt=>{const h=parseHealth(txt);if(!h){toast('No DADMODE line found. Run the Shortcut first.');return}const msg=applyHealth(h);closeSheet();render();toast(`Imported: ${msg}`)},fallback)}catch(e){fallback()}},
  export:()=>exportData(),
  import:()=>importData(),
  copyExport:()=>{const t=$('#exportTxt');const done=()=>toast('Backup copied');try{navigator.clipboard.writeText(t.value).then(done,()=>{t.focus();t.select();toast('Text selected. Tap Copy in the menu.')})}catch(e){t.focus();t.select();toast('Text selected. Tap Copy in the menu.')}},
  downloadExport:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`dad-mode-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('Download not available here. Use Copy.')}},
  reset:el=>{if(el.dataset.armed){S=defaults();save();P=null;SF={step:'start'};foodDate=null;closeSheet();go('today');render(true);toast('Programme reset. Day one, starting now.')}else{el.dataset.armed='1';el.textContent='Tap again to erase everything';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Reset programme'}},4000)}},
  closeCelebrate:()=>{$('#celebrate').hidden=true}
};
function initAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function recalcMilestones(){const ws=weightsSorted();Object.keys(S.milestones).forEach(m=>{const hit=ws.find(w=>w.kg<=+m);if(!hit)delete S.milestones[m];else S.milestones[m]=hit.date})}

const F={
  food:f=>{const fd=new FormData(f);const name=String(fd.get('name')||'').trim();const kcal=num(fd.get('kcal')),p=num(fd.get('protein'))||0;
    if(!name||kcal===null||kcal<0||kcal>5000){toast('Add a food name and calories');return}
    const k=foodDate||todayKey();const D=ensureDay(k);const id=fd.get('id');const meal=fd.get('meal');
    if(id){const e=D.food.find(x=>x.id===id);if(e)Object.assign(e,{name,kcal:Math.round(kcal),protein:Math.round(p*10)/10,meal})}
    else D.food.push({id:uid(),meal,name,kcal:Math.round(kcal),protein:Math.round(p*10)/10});
    const exists=S.favourites.find(x=>x.name.toLowerCase()===name.toLowerCase());
    const ing=String(fd.get('ing')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,15);
    if(fd.get('fav')){if(exists)Object.assign(exists,{kcal:Math.round(kcal),protein:p,meal,ing});else S.favourites.push({id:uid(),name,kcal:Math.round(kcal),protein:p,meal,ing})}
    else if(exists&&id){S.favourites=S.favourites.filter(x=>x!==exists)}
    save();closeSheet();render();toast(id?'Saved':'Added to diary')},
  steps:f=>{const v=num(new FormData(f).get('steps'));if(v===null||v<0||v>100000){toast('Enter a step count');return}const D=ensureDay(todayKey());D.steps=Math.round(v);save();closeSheet();render();toast(D.steps>=S.settings.steps?'Step target hit. Brilliant.':'Steps saved')},
  otherSnack:f=>{const fd=new FormData(f);const n=String(fd.get('name')||'').trim();if(!n)return;const k=Math.round(num(fd.get('kcal'))||0),p=num(fd.get('protein'))||0;logSnack(SF.reason||'planned','ate',n,k,p);closeSheet();SF={step:'done',msg:`Logged ${n}${k?` (~${k} kcal)`:''}. That's awareness, and awareness is the whole game. Next meal, carry on as planned.`};render()},
  weight:f=>{const fd=new FormData(f);const v=num(fd.get('kg'));const date=fd.get('date')||todayKey();
    if(v===null||v<40||v>250){toast('Enter your weight in kg');return}
    const prevList=weightsSorted().filter(w=>w.date<date);const prev=prevList[prevList.length-1]||(date>=S.settings.startDate?{kg:S.settings.startWeight}:null);
    const same=S.weights.find(w=>w.date===date);if(same)same.kg=Math.round(v*10)/10;else S.weights.push({id:uid(),date,kg:Math.round(v*10)/10});
    const newly=[];MILESTONES.forEach(m=>{if(!S.milestones[m]&&v<=m){S.milestones[m]=date;newly.push(m)}});
    save();render();
    if(newly.length){celebrate(Math.min(...newly));return}
    if(prev){const d=v-prev.kg;toast(d<=-0.1?`Down ${kg1(-d)}kg since last weigh-in`:d<0.1?'Same as last time. Steady.':`Up ${kg1(d)}kg. Normal fluctuation. Watch the average.`)}else toast('Weight saved')},
  review:f=>{const fd=new FormData(f);const r={week:fd.get('week'),date:todayKey(),weight:num(fd.get('weight')),steps:num(fd.get('steps')),workouts:num(fd.get('workouts'))||0,nutrition:+fd.get('nutrition')||null,snacking:+fd.get('snacking')||null,energy:+fd.get('energy')||null,sleep:+fd.get('sleep')||null,win:String(fd.get('win')||'').trim(),challenge:String(fd.get('challenge')||'').trim()};
    S.reviews=S.reviews.filter(x=>x.week!==r.week);S.reviews.push(r);
    if(r.weight&&r.weight>40&&r.weight<250&&!S.weights.some(w=>w.date===r.date)){S.weights.push({id:uid(),date:r.date,kg:Math.round(r.weight*10)/10});MILESTONES.forEach(m=>{if(!S.milestones[m]&&r.weight<=m)S.milestones[m]=r.date})}
    save();openSheet(`<div class="eyebrow">Week of ${fmtDate(r.week)}</div><div class="sec-title">Your week</div>${reviewSummary(r)}<button class="btn primary block" data-action="closeSheet">Done</button>`);render()},
  settings:f=>{const fd=new FormData(f), s=S.settings;
    const g=(n,min,max)=>{const v=num(fd.get(n));return v!==null&&v>=min&&v<=max?v:null};
    const set=(key,v,tf=x=>x)=>{if(v!==null)s[key]=tf(v)};
    set('kcal',g('kcal',1200,5000),Math.round);set('protein',g('protein',40,300),Math.round);set('waterMl',g('water',0.5,6),v=>Math.round(v*1000));
    set('steps',g('steps',1000,40000),Math.round);set('target',g('target',40,250));set('stretch',g('stretch',40,250));set('restSec',g('restSec',10,180),Math.round);
    s.rundown=!!fd.get('rundown');s.phase=+fd.get('phase')||0;set('age',g('age',16,90),Math.round);set('startWeight',g('startWeight',40,250));set('heightCm',g('heightCm',120,230));
    const sd=fd.get('startDate');if(sd&&/^\d{4}-\d{2}-\d{2}$/.test(sd))s.startDate=sd;
    save();closeSheet();render();toast('Targets saved')},
  activity:f=>{const fd=new FormData(f);const m=num(fd.get('minutes'));if(!m||m<1||m>600){toast('Enter minutes');return}
    const date=fd.get('date')||todayKey(),type=fd.get('type');
    S.workouts.push({id:uid(),ts:Date.now(),date,type:'activity',label:type,status:'done',minutes:Math.round(m),note:String(fd.get('note')||'').trim()});
    const D=ensureDay(date);const p=planFor(date,D);if(p.kind!=='strength'||p.swapped)D.mission=true;
    save();closeSheet();render();toast(`${type} logged. Every minute counts.`)},
  shopAdd:f=>{const v=String(new FormData(f).get('item')||'').trim();if(!v)return;const ws=planWs();S.shopExtra[ws]=S.shopExtra[ws]||[];if(!S.shopExtra[ws].includes(v))S.shopExtra[ws].push(v);save();render()},
  waist:f=>{const fd=new FormData(f);const v=num(fd.get('cm'));const date=fd.get('date')||todayKey();if(v===null||v<50||v>200){toast('Enter your waist in cm');return}
    const prev=waistSorted().filter(w=>w.date<date).pop();const same=S.waist.find(w=>w.date===date);if(same)same.cm=Math.round(v*10)/10;else S.waist.push({id:uid(),date,cm:Math.round(v*10)/10});save();render();
    toast(prev?(v<prev.cm?`Down ${kg1(prev.cm-v)}cm. Clothes will notice before the scale does.`:'Saved. Waist moves slowly; check the trend monthly.'):'First measurement saved')},
  barcode:f=>{lookupBarcode(new FormData(f).get('code'))},
  product:f=>{const fd=new FormData(f);const k=num(fd.get('kcal100')),p=num(fd.get('p100'))||0,g=num(fd.get('grams'));if(k==null||!g){toast('Enter calories per 100g and an amount');return}
    const code=fd.get('code');const x=S.scans.find(y=>y.code===code);if(x){x.kcal100=k;x.p100=p}
    const D=ensureDay(foodDate||todayKey());D.food.push({id:uid(),meal:fd.get('meal'),name:`${x?x.name:'Scanned food'} (${n0(g)}g)`,kcal:Math.round(k*g/100),protein:Math.round(p*g/10)/10});
    save();closeSheet();render();toast('Added to diary')},
  cloud:async f=>{const fd=new FormData(f);let url=String(fd.get('url')||'').trim(),key=String(fd.get('key')||'').trim(),code=String(fd.get('code')||'');
    if(!/^https:\/\/.+/.test(url)||key.length<20){toast('Add your Project URL and anon key');return}
    const prev=S.cloud;S.cloud=Object.assign({},prev,{url:url.replace(/\/+$/,''),key,code});saveLocal();
    toast('Testing connection…');const n=await pullHealth(true);
    if(n<0){toast('Couldn\'t connect: '+S.cloud.error+'. Check the URL, key and that the setup code ran.');cloudSheet();return}
    await pushBackup();render();cloudSheet();toast('Connected. Cloud sync is on.')},
  checkin:f=>{const fd=new FormData(f);const feeling=+fd.get('feeling');if(!feeling){toast('Pick how you feel');return}
    const D=ensureDay(todayKey());const sv=num(fd.get('sleep'));
    D.checkin={feeling,sleepHrs:sv!=null?sv:null,wakes:+fd.get('wakes')||0,note:String(fd.get('note')||'').trim(),at:Date.now()};
    D.rundownSkip=false;rundownOpen=true;save();closeSheet();render();},
  health:f=>{const h=parseHealth(new FormData(f).get('txt'));if(!h){toast('That line needs to start with DADMODE, from the Shortcut');return}const msg=applyHealth(h);closeSheet();render();toast(`Imported: ${msg}`)},
  import:f=>{const txt=String(new FormData(f).get('json')||'').trim();try{const o=JSON.parse(txt);if(!o||!o.settings||!Array.isArray(o.weights))throw 0;S=migrate(o);save();closeSheet();render(true);toast('Backup restored')}catch(e){toast('That doesn\'t look like a DAD MODE backup')}}
};
function celebrate(m){
  const c=$('#celebrate');
  c.innerHTML=`<div class="cel"><span class="eyebrow" style="color:var(--green-hi)">Milestone reached</span><div class="cel-ring"><span class="num" style="font-size:52px">${m}</span></div><div class="sec-title" style="font-size:30px">${m}kg</div><p class="muted">${MILE_MSG[m]}</p><button class="btn primary" data-action="closeCelebrate">Get in</button></div>`;
  c.hidden=false;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('submit',e=>{e.preventDefault();const fn=F[e.target.dataset.form];if(fn)fn(e.target)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.change==='habit'){const k=todayKey();const D=ensureDay(k);D.habits[el.dataset.key]=el.checked;save();render()}
  if(el.dataset.change==='planMeal'){const ws=weekStart(el.dataset.date),P7=planFor7(ws);P7[el.dataset.date]=P7[el.dataset.date]||{};const o=el.value?resolveMeal(el.value,el.dataset.meal):null;
    if(o)P7[el.dataset.date][el.dataset.meal]={name:o.name,kcal:o.kcal,protein:o.protein,ing:o.ing};else if(el.value==='')delete P7[el.dataset.date][el.dataset.meal];save();render()}
  if(el.dataset.change==='shopTick'){const ws=planWs();S.shopChecked[ws]=S.shopChecked[ws]||{};S.shopChecked[ws][el.dataset.name]=el.checked;save();render()}
  if(el.dataset.change==='photoAdd'&&el.files&&el.files[0]){const f=el.files[0];shrinkImage(f).then(data=>photoPut({id:uid(),ts:Date.now(),date:todayKey(),data})).then(()=>{toast('Photo saved');fillPhotos()}).catch(()=>toast('Couldn\'t save that photo here'));el.value=''}
  if(el.dataset.change==='scanPhoto'&&el.files&&el.files[0]){scanFromFile(el.files[0]);el.value=''}
  if(el.dataset.change==='importFile'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{$('#importTxt').value=r.result};r.readAsText(el.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
window.addEventListener('hashchange',()=>{const t=readHash();if(t!==tab){tab=t;render(true)}});
let lastDay=todayKey();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(cloudOn())pullHealth(true).then(n=>{if(n>0&&$('#sheet').hidden&&!P)render()});if(todayKey()!==lastDay){lastDay=todayKey();foodDate=null}if($('#sheet').hidden&&!P)render()}else unlockScreen()});
setInterval(()=>{if(todayKey()!==lastDay){lastDay=todayKey();if($('#sheet').hidden&&!P)render()}},60000);

const VIEWS={today:viewToday,snack:viewSnack,food:viewFood,train:viewTrain,progress:viewProgress};
load();tab=readHash();render(true);
if(cloudOn())pullHealth(true).then(n=>{if(n>0&&$('#sheet').hidden&&!P)render()});
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
