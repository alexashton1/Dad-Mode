<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DAD MODE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DAD MODE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 480px thumb-first column, scoreboard numerals on calm charcoal cards, fixed tab bar within thumb reach */
:root{
  --bg:#141716; --surface:#1b1f1e; --surface-2:#252a28; --line:#2e3431;
  --fg:#efede5; --muted:#9aa29c; --faint:#69716c;
  --green:#8db088; --green-hi:#b5d1ab; --green-ink:#0f170e; --green-wash:rgba(141,176,136,.13); --green-line:rgba(141,176,136,.35);
  --amber:#d9b66c; --clay:#d38d76;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:20px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(104px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;line-height:.92;letter-spacing:.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.flat{background:transparent}
.sec-title{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.est{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(217,182,108,.4);border-radius:6px;padding:1px 5px;font-weight:600;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface)}
.chip.on{border-color:var(--green-line);color:var(--green-hi);background:var(--green-wash)}
button.chip{cursor:pointer}

/* Buttons */
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--fg);min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid rgba(211,141,118,.5);color:var(--clay)}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.check:focus-within{outline:2px solid var(--green-hi);outline-offset:2px}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.link{white-space:nowrap;appearance:none;background:none;border:0;color:var(--green-hi);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}

/* Bars */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .5s ease}
.bar.amber>i{background:var(--amber)}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:6px}
.brand{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.06em;line-height:1}
.brand b{color:var(--green)}
.tagline{color:var(--muted);font-size:13px;margin-top:-6px}

/* Weight hero */
.hero-w{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.hero-w .big{font-size:64px}
.hero-w .big small{font-size:22px;color:var(--muted);margin-left:3px}
.kv{display:flex;gap:14px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv .num{font-size:21px}
.track{position:relative;height:10px;border-radius:99px;background:var(--surface-2)}
.track>i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:99px;transition:width .6s ease}
.track .tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--line);border-radius:2px}
.track .tick.hit{background:var(--green-hi)}
.track-labels{position:relative;height:16px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.track-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.track-labels span:first-child{transform:none}
.track-labels span:last-child{transform:translateX(-100%)}

/* Mission */
.mission{background:var(--green-wash);border-color:var(--green-line)}
.mission .m-title{font-family:var(--display);font-weight:700;font-size:34px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.mission .m-label{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--green-hi)}
.done-pill{display:inline-flex;align-items:center;gap:6px;color:var(--green-ink);background:var(--green-hi);border-radius:99px;padding:4px 10px;font-weight:700;font-size:12px}

/* Coach */
.coach{flex-direction:row;gap:14px;align-items:flex-start}
.coach .avatar{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--green-hi);letter-spacing:.04em}
.coach .msg{font-size:15.5px;line-height:1.4}

/* Tiles */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .num.v{font-size:32px}
.tile .of{font-size:12px;color:var(--muted)}
.tile-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ring{flex:none}
.ring circle{fill:none}
.mini-btns{display:flex;gap:6px}
.mini-btns .btn{flex:1;min-height:34px;padding:6px 4px;font-size:13px;border-radius:10px}

/* Checklist */
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--faint);display:grid;place-items:center;transition:all .15s}
.box svg{width:14px;height:14px;opacity:0;stroke:var(--green-ink)}
.check input:checked + .box{background:var(--green);border-color:var(--green)}
.check input:checked + .box svg{opacity:1}
.check .lbl{flex:1;font-size:14.5px}
.check input:checked ~ .lbl{color:var(--muted)}
.auto{font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px}
.wcol{width:100%;height:64px;background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.wcol i{position:absolute;left:0;right:0;bottom:0;background:var(--green);border-radius:8px 8px 0 0}
.wcol.future{opacity:.35}
.wday .d{font-size:11px;color:var(--muted);font-weight:600}
.wday.today .d{color:var(--green-hi)}
.wday .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wday .dot.on{background:var(--amber)}

/* Snack */
.crave{appearance:none;border:0;cursor:pointer;width:100%;border-radius:24px;padding:26px 18px;background:var(--green);color:var(--green-ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.crave .num{font-size:34px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.crave span{font-size:13px;font-weight:600;opacity:.8}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px}
.item .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:10px}
.hbar .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.breath-box{width:120px;height:120px;border-radius:24px;border:2px solid var(--green);display:grid;place-items:center;transition:transform 4s linear, background 4s linear}
.breath-box.in{transform:scale(1.25);background:var(--green-wash)}
.breath-box.out{transform:scale(.85)}

/* Food */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h{display:flex;justify-content:space-between;align-items:center}
.meal-h h3{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.entry{appearance:none;background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer}
.entry .grow{flex:1;min-width:0}
.entry .t{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.entry .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{font-size:13px;color:var(--faint);padding:4px 0}
.pick{appearance:none;cursor:pointer;background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:10px;width:100%;align-items:center}
.pick .t{font-size:14px;font-weight:500}
.pick .s{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.input,select.input,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;min-height:46px}
textarea.input{min-height:90px;resize:vertical;font-size:14px}
.input:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;min-height:36px}
.seg button.on{background:var(--fg);color:var(--bg)}
.scale{display:flex;gap:6px}
.scale label{flex:1;cursor:pointer}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:grid;place-items:center;height:40px;border-radius:10px;background:var(--surface-2);font-weight:700;font-family:var(--display);font-size:18px;color:var(--muted)}
.scale input:checked + span{background:var(--green);color:var(--green-ink)}
.scale input:focus-visible + span{outline:2px solid var(--green-hi)}
.scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* Train */
details.ex{border-top:1px solid var(--line)}
details.ex:first-of-type{border-top:0}
details.ex summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-size:14.5px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary .r{color:var(--green-hi);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
details.ex .how{font-size:13px;color:var(--muted);padding:0 0 12px;display:flex;flex-direction:column;gap:4px}
.wk-plan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-plan div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.wk-plan .b{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--faint)}
.wk-plan .b.s{color:var(--fg)}
.wk-plan .b.done{background:var(--green);color:var(--green-ink)}
.wk-plan .b.skip{background:transparent;border:1px dashed var(--faint)}
.wk-plan .today .b{outline:2px solid var(--green-hi);outline-offset:1px}
.wk-plan .today{color:var(--green-hi)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:28px}
.safety li{margin-bottom:6px}
.safety{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}

/* Progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.mile{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mile div{border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.mile .num{font-size:22px}
.mile div.hit{border-color:var(--green-line);background:var(--green-wash)}
.mile div.hit .num{color:var(--green-hi)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:6px 0}
td{padding:8px 0;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.up{color:var(--amber)} .down{color:var(--green-hi)}
.summary li{margin-bottom:6px}
.summary{margin:0;padding-left:18px;font-size:14px}
.rec{background:var(--green-wash);border:1px solid var(--green-line);border-radius:14px;padding:12px 14px;font-size:14px}
.callout{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,23,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.04em;cursor:pointer}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--green-hi)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .panel{position:relative;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;width:100%;max-width:480px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

/* Player */
#player{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
#player .in{max-width:480px;margin:0 auto;min-height:100%;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.p-ex{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;text-transform:uppercase}
.p-reps{font-family:var(--display);font-weight:600;font-size:76px;line-height:.9;color:var(--green-hi);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.dots i.on{background:var(--green)}
.dots i.cur{background:var(--green-hi)}
.timer-big{font-family:var(--display);font-weight:600;font-size:110px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}

/* Toast + celebrate */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:11px 16px;border-radius:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}
#celebrate{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.92);display:grid;place-items:center;padding:24px}
.cel{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cel .num{font-size:96px;color:var(--green-hi)}
.cel-ring{width:150px;height:150px;border-radius:50%;border:3px solid var(--green);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--fg)}
.banner{background:rgba(211,141,118,.12);border:1px solid rgba(211,141,118,.4);color:var(--clay);border-radius:14px;padding:10px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"><main id="view" aria-live="polite"></main></div>
<nav id="tabs" aria-label="Sections"><div class="in" id="tabsIn"></div></nav>
<div id="sheet" hidden><div class="backdrop" data-action="closeSheet"></div><div class="panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div id="player" hidden></div>
<div id="celebrate" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
/* ---------- Utilities ---------- */
const KEY='dadmode.v1', DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p2=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseDk=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dk(new Date());
const addDays=(k,n)=>{const d=parseDk(k);d.setDate(d.getDate()+n);return dk(d)};

function migrate(o){
  const d=defaults();
  o.settings=Object.assign(d.settings,o.settings||{});
  ['days','milestones','plans','shopChecked','shopExtra','cloud'].forEach(k=>{if(!o[k]||typeof o[k]!=='object')o[k]={}});
  ['weights','workouts','snacks','favourites','reviews','waist','scans'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  return o;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=migrate(JSON.parse(raw));return}}catch(e){storageOK=false}
  S=defaults();save();
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false}}

function weightsSorted(){return [...S.weights].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}

function weekInfo(k){const d=daysBetween(S.settings.startDate,k);const n=Math.max(1,Math.floor(d/7)+1);return {n,label:n<=12?`${n} of 12`:`${n}`}}
function planFor(k,D){
  const wd=parseDk(k).getDay(), three=S.settings.workoutsPerWeek>=3, ph=phaseOf(k);
  const slots=three?{1:0,3:1,5:2}:{1:0,4:1}, order=strengthOrder(ph), per=three?3:2, wn=weekInfo(k).n;
  let p;
  if(slots[wd]!==undefined){const sl=slots[wd];p={kind:'strength',w:(ph===1&&!three)?order[sl]:order[((wn-1)*per+sl)%order.length]}}
  else p={kind:wd===0?'sunday':wd===6?'weekend':(!three&&wd===3)?'recovery':'walk'};
  const r=S.settings.rounds;
  const T={
    strength:()=>({title:`Morning strength`,detail:`${WORKOUTS[p.w].name}, ${r} rounds, about 20 minutes. Ideally done before 9am.`}),
    walk:()=>({title:'Walking',detail:'30–45 minutes out. A pram walk with the baby counts. Aim for your step target.'}),
    recovery:()=>({title:'Active recovery',detail:'10 minutes of mobility on the mat, plus an easy walk.'}),
    weekend:()=>({title:'Family walk or sport',detail:'Get out together. A long walk, a kickabout, or a game if you can get one in. Optional extra exercise.'}),
    sunday:()=>({title:'Recovery and review',detail:'An easy walk, then 5 minutes on your weekly review.'})
  };
  if(D&&D.roughNight&&p.kind==='strength'){return {kind:'walk',swapped:p.w,title:'Easy walk',detail:`Swapped from ${WORKOUTS[p.w].name} after a rough night. 20–30 minutes is plenty today.`}}
  return Object.assign(p,T[p.kind]());
}
const kcalOf=D=>sum(D.food,'kcal'), protOf=D=>sum(D.food,'protein');
function autoHabit(k,D,key){
  const s=S.settings;
  switch(key){
    case 'steps':return D.steps>=s.steps;
    case 'activity':return !!D.mission;
    case 'protein':return protOf(D)>=s.protein;
    case 'water':return D.waterMl>=s.waterMl;
    case 'sleep':{const h=sleepOf(D);return h!=null&&h>=7}
    case 'meals':return ['breakfast','lunch','dinner'].every(m=>D.food.some(f=>f.meal===m));
    default:return false;
  }
}
const AUTO_KEYS=['steps','activity','protein','water','meals','sleep'];
function habitDone(k,key){const D=getDay(k);const m=D.habits[key];if(m===true)return true;if(m===false)return false;return autoHabit(k,D,key)}
function habitCount(k){return HABITS.filter(([h])=>habitDone(k,h)).length}
function hasData(k){const D=S.days[k];return !!D&&(D.steps>0||D.waterMl>0||D.food.length>0||D.mission||Object.keys(D.habits).length>0)}
function weekStats(ws){
  const s=S.settings, t=todayKey(), days=[];
  for(let i=0;i<7;i++){const k=addDays(ws,i);if(k<=t&&k>=s.startDate)days.push(k)}
  const we=addDays(ws,6);
  const wos=S.workouts.filter(w=>w.date>=ws&&w.date<=we);
  const strength=wos.filter(w=>['A','B','C'].includes(w.type)&&w.status==='done').length;
  const skipped=wos.filter(w=>w.status==='skipped').length;
  const activeMin=wos.filter(w=>w.status==='done').reduce((a,w)=>a+(+w.minutes||0),0);
  const stepVals=days.map(k=>getDay(k).steps).filter(v=>v>0);
  const logged=days.filter(k=>getDay(k).food.length>0);
  const onTarget=logged.filter(k=>kcalOf(getDay(k))<=s.kcal*1.1).length;
  const protHit=logged.filter(k=>protOf(getDay(k))>=s.protein).length;
  const tracked=days.filter(hasData);
  const sleepVals=days.map(k=>sleepOf(getDay(k))).filter(v=>v!=null&&v>0);
  const habitPct=days.length?days.reduce((a,k)=>a+habitCount(k),0)/(days.length*HABITS.length):0;
  return {sleepAvg:avg(sleepVals),sleepDays:sleepVals.length,days,strength,skipped,activeMin,stepsAvg:avg(stepVals),stepDays:stepVals.length,logged:logged.length,onTarget,protHit,tracked:tracked.length,habitPct,wos};
}
function weeklyAverages(){
  const g={};weightsSorted().forEach(w=>{const ws=weekStart(w.date);(g[ws]=g[ws]||[]).push(w.kg)});
  return Object.keys(g).sort().map(ws=>({ws,avg:avg(g[ws]),n:g[ws].length}));
}
function trend(){const wa=weeklyAverages();if(wa.length<2)return null;const a=wa[wa.length-2],b=wa[wa.length-1];return {change:b.avg-a.avg}}

async function startCamera(){

async function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<6){toast('That barcode number looks too short');return}
  const cached=S.scans.find(x=>x.code===code);
  const st=$('#scanStatus');if(st)st.textContent=`Looking up ${code}…`;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_size,serving_quantity`);
    const j=await r.json();
    if(j.status!==1||!j.product){if(cached){productSheet(cached);return}if($('#scanStatus'))$('#scanStatus').textContent=`No product found for ${code}. Add it manually with the packet values.`;return}
    const pr=j.product, n=pr.nutriments||{};
    let kcal=n['energy-kcal_100g'];if(kcal==null&&n.energy_100g!=null)kcal=n.energy_100g/4.184;
    const item={code,name:[pr.product_name,pr.brands&&pr.brands.split(',')[0]].filter(Boolean).join(' · ')||`Product ${code}`,kcal100:kcal!=null?+kcal:null,p100:n.proteins_100g!=null?+n.proteins_100g:null,servingG:+pr.serving_quantity||null,servingTxt:pr.serving_size||''};
    S.scans=S.scans.filter(x=>x.code!==code);S.scans.push(item);if(S.scans.length>30)S.scans=S.scans.slice(-30);save();
    productSheet(item);
  }catch(e){
    if(cached){productSheet(cached);return}
    if($('#scanStatus'))$('#scanStatus').textContent='Couldn\'t reach Open Food Facts. Lookup needs an internet connection and works in the installed app (not inside Claude).';
  }
}

function sleepSnackStats(){
  const t=todayKey(), short=[], good=[];
  for(let i=1;i<=42;i++){const k=addDays(t,-i);if(k<S.settings.startDate)break;const D=getDay(k);const sl=sleepOf(D);if(sl==null)continue;
    const n=S.snacks.filter(x=>x.date===k&&x.reason!=='planned').length;(sl<6.5?short:good).push(n)}
  const nights=short.length+good.length;
  if(short.length<3||good.length<3)return {ready:false,nights,short:short.length,good:good.length};
  const a=avg(short),b=avg(good);
  return {ready:true,nights,shortAvg:a,goodAvg:b,ratio:b>0?a/b:(a>0?Infinity:1)};
}
function sleepSnackCard(){
  const r=sleepSnackStats();
  if(!r.ready){const need=Math.max(0,3-r.short)+Math.max(0,3-r.good);
    return `<section class="card"><div class="row between"><div class="sec-title">Sleep vs cravings</div><span class="chip">${r.nights} nights</span></div>
    <p class="small muted">Once there are 3 short nights (under 6½ hours) and 3 good ones, with cravings logged, this shows whether tiredness drives your snacking. ${need?`About ${need} more night${need===1?'':'s'} needed.`:''} Sleep comes from your Garmin import or the morning check-in.</p></section>`}
  const big=r.ratio>=1.3&&isFinite(r.ratio);
  const msg=!isFinite(r.ratio)?'You only log unplanned cravings after short nights. Tiredness is clearly a trigger.':
    big?`After short nights you have about ${r.ratio.toFixed(1)}x more cravings (${r.shortAvg.toFixed(1)} vs ${r.goodAvg.toFixed(1)} a day). On tired days, plan the 3pm snack in advance.`:
    r.ratio<=0.8?`Interesting: you crave less after short nights (${r.shortAvg.toFixed(1)} vs ${r.goodAvg.toFixed(1)} a day). Boredom may matter more than tiredness for you.`:
    `Sleep doesn't seem to change your cravings much (${r.shortAvg.toFixed(1)} vs ${r.goodAvg.toFixed(1)} a day). Look at the "why" bars instead.`;
  return `<section class="card"><div class="row between"><div class="sec-title">Sleep vs cravings</div><span class="small muted">Last 6 weeks</span></div>
    <div class="hbars"><div class="hbar"><span>Short nights</span>${bar(r.shortAvg/Math.max(r.shortAvg,r.goodAvg,0.1),'amber')}<span class="c">${r.shortAvg.toFixed(1)}</span></div><div class="hbar"><span>Good nights</span>${bar(r.goodAvg/Math.max(r.shortAvg,r.goodAvg,0.1))}<span class="c">${r.goodAvg.toFixed(1)}</span></div></div>

    <div class="rec">${esc(msg)}</div></section>`;

/* ---------- Cloud sync (Supabase) ---------- */
const SETUP_SQL=`-- DAD MODE cloud sync. Paste into Supabase > SQL Editor > New query > Run.
create table if not exists dadmode_health (
  sync_id text not null,
  day date not null,
  steps int, sleep numeric, active int, rhr int,
  updated_at timestamptz default now(),
  primary key (sync_id, day)
);
create table if not exists dadmode_backup (
  sync_id text primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);
alter table dadmode_health enable row level security;
alter table dadmode_backup enable row level security;
-- No policies on purpose: the tables are only reachable through the functions below,
-- and every function needs your private sync code.

create or replace function dadmode_push_health(p_sync text, p_day date, p_steps numeric default null, p_sleep numeric default null, p_active numeric default null, p_rhr numeric default null)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_sync) < 20 then raise exception 'sync code too short'; end if;
  insert into dadmode_health (sync_id, day, steps, sleep, active, rhr, updated_at)
  values (p_sync, p_day, round(p_steps), p_sleep, round(p_active), round(p_rhr), now())
  on conflict (sync_id, day) do update set
    steps = coalesce(excluded.steps, dadmode_health.steps),
    sleep = coalesce(excluded.sleep, dadmode_health.sleep),
    active = coalesce(excluded.active, dadmode_health.active),
    rhr = coalesce(excluded.rhr, dadmode_health.rhr),
    updated_at = now();
end $$;

create or replace function dadmode_pull_health(p_sync text, p_since date)
returns setof dadmode_health language sql security definer set search_path = public as $$
  select * from dadmode_health where sync_id = p_sync and day >= p_since order by day
$$;

create or replace function dadmode_save_backup(p_sync text, p_data jsonb)
returns void language plpgsql security definer set search_path = public as $$
begin
  if length(p_sync) < 20 then raise exception 'sync code too short'; end if;
  insert into dadmode_backup (sync_id, data, updated_at) values (p_sync, p_data, now())
  on conflict (sync_id) do update set data = excluded.data, updated_at = now();
end $$;

create or replace function dadmode_load_backup(p_sync text)
returns jsonb language sql security definer set search_path = public as $$
  select data from dadmode_backup where sync_id = p_sync
$$;

grant execute on function dadmode_push_health(text, date, numeric, numeric, numeric, numeric) to anon;
grant execute on function dadmode_pull_health(text, date) to anon;
grant execute on function dadmode_save_backup(text, jsonb) to anon;
grant execute on function dadmode_load_backup(text) to anon;`;
const cloudOn=()=>!!(S.cloud&&S.cloud.url&&S.cloud.key&&S.cloud.code);
function newSyncCode(){const a=new Uint8Array(18);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0);return 'dm_'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
async function rpc(fn,body){
  const base=S.cloud.url.replace(/\/+$/,'');
  const r=await fetch(`${base}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'apikey':S.cloud.key,'Authorization':`Bearer ${S.cloud.key}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(`${r.status} ${m}`.trim())}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function pullHealth(silent){
  if(!cloudOn())return 0;
  try{
    const rows=await rpc('dadmode_pull_health',{p_sync:S.cloud.code,p_since:addDays(todayKey(),-14)});
    let n=0;(rows||[]).forEach(r=>{const h={date:String(r.day).slice(0,10)};

const FEEL=['','Rough','Flat','OK','Good','Great'];
const SLEEP_LBL={4.5:'under 5 hours',5.5:'5–6 hours',6.5:'6–7 hours',7.5:'7–8 hours',8.5:'8+ hours'};
const sleepTxt=D=>D.sleepHrs!=null?fmtHrs(D.sleepHrs):(D.checkin&&SLEEP_LBL[D.checkin.sleepHrs])||'';
const sleepOf=D=>D.sleepHrs!=null?D.sleepHrs:(D.checkin&&D.checkin.sleepHrs!=null?D.checkin.sleepHrs:null);

function coachSection(k,D,plan){

function rundown(k,D,plan){
  const s=S.settings, c=D.checkin, f=c.feeling, sl=sleepOf(D), wakes=c.wakes||0;
  const wd=parseDk(k).getDay(), workday=wd>=1&&wd<=5, h=new Date().getHours();
  const tired=(sl!=null&&sl<6)||wakes>=2||f<=2;
  const wrecked=(sl!=null&&sl<5)||f===1;
  const list=[];
  // opener
  let opener;
  if(wrecked) opener=`Tough night${sl!=null?`, ${sleepTxt(D)} of sleep`:''}. Today is about damage limitation, not heroics. Small wins count double.`;
  else if(tired) opener=`Running a bit low today${sl!=null?` on ${sleepTxt(D)} of sleep`:''}. That's new-dad life. Keep the basics and go easy on yourself.`;
  else if(f>=4&&(sl==null||sl>=7)) opener=`${FEEL[f]} start${sl!=null?` and ${sleepTxt(D)} of sleep`:''}. This is a day to bank some progress.`;
  else opener=`A steady day. Nothing fancy, just tick the basics off one at a time.`;
  if(h>=12) opener+=` Here's the plan for the rest of the day.`;
  // yesterday
  const y=addDays(k,-1);
  if(y>=s.startDate&&hasData(y)){const Y=getDay(y);const hc=habitCount(y);const wo=S.workouts.find(w=>w.date===y&&w.status==='done');
    list.push({h:'Yesterday',t:`${hc}/8 habits${Y.steps?`, ${n0(Y.steps)} steps`:''}${wo?`, ${wo.label} done`:''}. ${hc>=6?'A good platform to build on.':hc>=4?'Solid enough. Today can be a notch better.':'Yesterday is done. Today starts fresh.'}`});}
  // sleep note
  if(sl!=null){
    let t;
    if(sl<5) t='Under 5 hours. Expect stronger cravings and lower willpower this afternoon. That\'s biology, not weakness. Caffeine before 1pm only, and aim for bed by 9:30.';
    else if(sl<6.5) t=`${sleepTxt(D)} is short. Tired brains want sugar, so plan your 3pm treat now rather than raiding the cupboard later. Get daylight before 10am.`;
    else if(sl<7.5) t=`${sleepTxt(D)} is decent for a dad of a newborn. Normal service today.`;
    else t=`${sleepTxt(D)}. A proper night. Your body will recover well from training today.`;
    if(wakes>=2) t+=` Up ${wakes>=3?'3 or more times':'twice'} with the baby too, so be kind to yourself.`;
    list.push({h:'Sleep',t});
  } else if(wakes>=2) list.push({h:'Sleep',t:'Broken night with the baby. Expect a bit less energy and stronger cravings, and plan around it.'});
  // movement
  if(D.mission) list.push({h:'Movement',t:`${plan.title} is already done. Anything else today is a bonus.`});
  else if(plan.kind==='strength'){
    if(wrecked) list.push({h:'Movement',t:`${WORKOUTS[plan.w].name} is on the plan, but after a night like that a 20–30 minute walk is the better choice. Consistency doesn't mean perfection.`,btn:['Swap to a walk','swapWalk']});
    else if(tired) list.push({h:'Movement',t:`${WORKOUTS[plan.w].name} is on. Do 2 rounds and use the easier versions if you need to. Showing up is the win.`,btn:['Start workout','startToday']});
    else list.push({h:'Movement',t:`${WORKOUTS[plan.w].name}, ${s.rounds} rounds, ideally before 9am. ${f>=4&&sl!=null&&sl>=7&&s.rounds<3?'Feeling good, so try a third round if it\'s flowing.':'Kettlebell out, kit on, done.'}`,btn:['Start workout','startToday']});
  } else list.push({h:'Movement',t:`${plan.title}: ${plan.detail}`});
  // steps
  const left=Math.max(0,s.steps-D.steps);
  if(left>0) list.push({h:'Steps',t:`${n0(left)} to go. ${workday?'Split it: 15 minutes before 9, a lap at lunch, then a pram walk after 5. That covers most of it.':'A family walk does most of the work today.'}`});
  else list.push({h:'Steps',t:'Step target already hit. Brilliant.'});
  // food
  const kc=kcalOf(D), pr=protOf(D);
  const sp=x=>Math.round(s.protein*x/5)*5;
  const pt=plannedToday(k);const tonight=pt.dinner?` Tonight's plan: ${pt.dinner.name}.`:'';
  list.push({h:'Food',t:`${n0(Math.max(0,s.kcal-kc))} kcal and ${n0(Math.max(0,s.protein-pr))}g protein left. Rough split: ${sp(.25)}g at breakfast, ${sp(.3)}g at lunch, ${sp(.3)}g at dinner, ${sp(.15)}g in a snack.${tired?' On a tired day, keep meals simple: pick from your favourites.':''}${tonight}`});
  // 3pm
  const ss=sleepSnackStats();const ssNote=ss.ready&&tired&&ss.ratio>=1.3?` Your data says you crave ${isFinite(ss.ratio)?ss.ratio.toFixed(1)+'x':'far'} more after short nights, so this matters today.`:'';
  if(workday) list.push({h:'3pm',t:(tired?'Danger zone today. At 2:45, drink a glass of water and walk round the block. If you still want something, have a planned treat on a plate, like dark chocolate or a protein pudding.':'At 2:45, stand up, have some water and decide your snack on purpose. Use the craving button if the urge hits.')+ssNote});
  else list.push({h:'Treats',t:'Weekends are when grazing creeps in. Have one planned treat and enjoy it properly.'});
  // evening
  list.push({h:'Evening',t:wrecked||tired?'Screens down by 9pm and lights out as early as the baby allows. Sleep is the best thing you can do for tomorrow.':'Wind down from 9pm. Lay your kit out if tomorrow is a strength day.'});
  if(c.note) list.push({h:'Your note',t:`"${c.note}" Noted. It'll show up in your Sunday review.`});
  return {opener,list};
}

/* ---------- Coach ---------- */
function coach(){
  const k=todayKey(), D=getDay(k), s=S.settings, now=new Date(), h=now.getHours(), wd=now.getDay(), plan=planFor(k,D);
  if(!D.roughNight&&D.sleepHrs!=null&&D.sleepHrs<5.5&&plan.kind==='strength'&&!D.mission) return `Your Garmin says ${fmtHrs(D.sleepHrs)} of sleep. Tap "Rough night with the baby?" to swap today's workout for a walk. Consistency doesn't mean perfection.`;
  if(D.roughNight) return 'A difficult night with the baby? Today\'s workout is now a walk. Consistency doesn\'t mean perfection.';
  if(wd>=1&&wd<=5&&h>=14&&h<17) return 'It\'s the afternoon dip. Before reaching for the biscuit tin, ask yourself whether you\'re hungry or bored.';
  let streak=getDay(k).steps>=s.steps?1:0;
  for(let i=1;i<=30;i++){if(getDay(addDays(k,-i)).steps>=s.steps)streak++;else break}
  if(streak>=3) return `You've hit your steps ${streak} days running. Brilliant work.`;
  const lw=weekStats(addDays(weekStart(k),-7));
  if(lw.tracked>=3&&lw.habitPct<0.4&&wd>=1&&wd<=3) return 'Last week was a tough one. Forget Monday motivation. Start again at your next meal.';
  if(h<9&&plan.kind==='strength'&&!D.mission) return '20 minutes before work. Kettlebell out, kit on, done before the laptop opens.';
  const tr=trend(); if(tr&&tr.change<=-0.2) return `Your weekly average is down ${kg1(-tr.change)}kg. Slow and steady is exactly right.`;
  if(h>=20) return 'Bed soon if you can. Sleep is a training tool, especially with a newborn in the house.';
  const i=((daysBetween(s.startDate,k)%ROTATION.length)+ROTATION.length)%ROTATION.length;
  return ROTATION[i];
}

  </section>`;

function parseHealth(txt){
  const t=String(txt||'');
  if(!/DADMODE/i.test(t)) return null;
  const out={};
  const re=/(steps|sleep|active|rhr|date)\s*=\s*([0-9][0-9.,:\-]*)/gi;let m;
  while((m=re.exec(t))){const key=m[1].toLowerCase();let v=m[2].replace(/,(?=\d{3}\b)/g,'');
    if(key==='date'){if(/^\d{4}-\d{2}-\d{2}$/.test(v))out.date=v;continue}
    v=parseFloat(v.replace(',','.'));if(!isFinite(v))continue;
    if(key==='sleep'){ if(v>1440) v=v/3600; else if(v>24) v=v/60; if(v>0&&v<=16) out.sleep=Math.round(v*100)/100; }
    else if(key==='steps'){ if(v>=0&&v<100000) out.steps=Math.round(v) }
    else if(key==='active'){ if(v>=0&&v<6000) out.active=Math.round(v) }
    else if(key==='rhr'){ if(v>25&&v<150) out.rhr=Math.round(v) }
  }
  return Object.keys(out).filter(k=>k!=='date').length?out:null;
}
function applyHealth(h,silent){
  const k=h.date&&h.date<=todayKey()?h.date:todayKey();
  const D=ensureDay(k);
  if(h.steps!=null)D.steps=h.steps;
  if(h.sleep!=null)D.sleepHrs=h.sleep;
  if(h.active!=null)D.activeKcal=h.active;
  if(h.rhr!=null)D.rhr=h.rhr;
  D.healthAt=Date.now();
  save();
  const bits=[];if(h.steps!=null)bits.push(`${n0(h.steps)} steps`);if(h.sleep!=null)bits.push(`${fmtHrs(h.sleep)} sleep`);if(h.rhr!=null)bits.push(`HR ${h.rhr}`);
  return bits.join(' · ');
}

function weightChart(){
  const ws=weightsSorted(), s=S.settings;
  const W=340,H=210,L=34,R=40,T=12,B=26;
  const startK=ws.length&&ws[0].date<s.startDate?ws[0].date:s.startDate;
  const pts=ws.map(w=>({t:parseDk(w.date).getTime(),kg:w.kg}));
  if(!ws.some(w=>w.date<=s.startDate))pts.unshift({t:parseDk(s.startDate).getTime(),kg:s.startWeight});
  const x0=parseDk(startK).getTime(), lastT=pts[pts.length-1].t;
  const x1=Math.max(lastT,x0+21*DAY);
  const vals=pts.map(p=>p.kg);
  const yMin=Math.floor(Math.min(...vals,s.stretch)-0.5), yMax=Math.ceil(Math.max(...vals,s.startWeight)+0.5);
  const sx=t=>L+(t-x0)/(x1-x0)*(W-L-R), sy=v=>T+(yMax-v)/(yMax-yMin)*(H-T-B);
  const step=(yMax-yMin)>12?4:(yMax-yMin)>6?2:1;
  let g='';
  for(let v=Math.ceil(yMin/step)*step;v<=yMax;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(v)+3}" text-anchor="end">${v}</text>`}
  [[s.target,'var(--green)'],[s.stretch,'var(--faint)']].forEach(([v,c])=>{g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="${c}" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${W-R+4}" y="${sy(v)+3}" style="fill:${c}">${v}kg</text>`});
  const ra=pts.map(p=>({t:p.t,v:avg(pts.filter(q=>q.t<=p.t&&q.t>p.t-7*DAY).map(q=>q.kg))}));
  const path=ra.map((p,i)=>`${i?'L':'M'}${sx(p.t).toFixed(1)},${sy(p.v).toFixed(1)}`).join('');
  const area=ra.length>1?`<path d="${path}L${sx(ra[ra.length-1].t).toFixed(1)},${H-B}L${sx(ra[0].t).toFixed(1)},${H-B}Z" fill="var(--green-wash)"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${sx(p.t).toFixed(1)}" cy="${sy(p.kg).toFixed(1)}" r="${i===pts.length-1?4.5:2.6}" fill="${i===pts.length-1?'var(--green-hi)':'var(--muted)'}"/>`).join('');
  const lastX=sx(pts[pts.length-1].t);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">${g}${area}<path d="${path}" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}
  <text x="${L}" y="${H-8}">${fmtDate(startK)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(dk(new Date(x1)))}</text>
  <text x="${Math.min(lastX,W-R-30)}" y="${sy(pts[pts.length-1].kg)-9}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${kg1(pts[pts.length-1].kg)}</text></svg>
  <div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><i style="width:14px;height:3px;background:var(--green);border-radius:2px;display:inline-block"></i>7-day average</span><span class="row" style="gap:6px"><i style="width:7px;height:7px;background:var(--muted);border-radius:50%;display:inline-block"></i>Weigh-ins</span></div>`;
}

      <div class="field" style="flex:1"><label for="w_kg">Weight (kg)</label><input class="input" id="w_kg" name="kg" inputmode="decimal" placeholder="${kg1(cw)}" required></div>
      <button class="btn primary" type="submit">Save</button>
    </form>
    <p class="tiny faint">Weigh three mornings a week (say Mon, Wed, Fri), after the toilet and before breakfast. Daily swings of 0.5–1.5kg from water, salt and carbs are normal. Watch the 7-day average, not single readings.</p>
  </section>
  <section class="card">
    <div class="row between"><div class="sec-title">Trend</div><span class="small muted">${ws.length?`${ws.length} weigh-in${ws.length===1?'':'s'}`:`Starting at ${kg1(s.startWeight)}kg`}</span></div>
    ${weightChart()}
    <div class="statrow">
      <div class="stat"><span class="eyebrow">Lost</span><span class="num" style="color:var(--green-hi)">${kg1(Math.max(0,lost))}</span></div>
      <div class="stat"><span class="eyebrow">To 100kg</span><span class="num">${cw>100?kg1(cw-100):'✓'}</span></div>
      <div class="stat"><span class="eyebrow">To 95kg</span><span class="num">${cw>95?kg1(cw-95):'✓'}</span></div>
    </div>
    ${rate!==null?`<p class="small muted">Averaging ${rate>=0?kg1(rate)+'kg lost':kg1(-rate)+'kg gained'} a week. Around 0.5kg a week is a sustainable pace.</p>`:''}
  </section>
  <section class="card">
    <div class="sec-title">Milestones</div>
    <div class="mile">${MILESTONES.map(m=>`<div class="${S.milestones[m]?'hit':''}"><span class="num">${m}</span><span class="tiny ${S.milestones[m]?'':'faint'}">${S.milestones[m]?fmtDate(S.milestones[m]):'kg'}</span></div>`).join('')}</div>
  </section>
  ${bodyCard()}
  ${wa.length?`<section class="card"><div class="sec-title">Weekly averages</div><div class="tbl-wrap"><table><thead><tr><th>Week of</th><th class="r">Avg</th><th class="r">Change</th><th class="r">Weigh-ins</th></tr></thead><tbody>
    ${[...wa].reverse().map((w,i,arr)=>{const prev=arr[i+1];const ch=prev?w.avg-prev.avg:null;return `<tr><td>${fmtDate(w.ws)}</td><td class="r">${kg1(w.avg)}</td><td class="r ${ch===null?'':ch<=0?'down':'up'}">${ch===null?'–':(ch>0?'+':'')+kg1(ch)}</td><td class="r">${w.n}</td></tr>`}).join('')}
  </tbody></table></div></section>`:''}
  <section class="card">
    <div class="row between"><div class="sec-title">Weekly review</div>${!wkey?`<button class="btn small" data-action="openReview">Review now</button>`:''}</div>
    ${wkey&&!S.reviews.some(r=>r.week===wkey)?`<p class="small muted">Your review for the week of ${fmtDate(wkey)} is ready.</p><button class="btn primary" data-action="openReview">Start weekly review</button>`:rv.length?'':`<p class="small muted">Every Sunday you'll be prompted to look back at the week. You get a summary and one thing to focus on next.</p>`}
    ${rv.map((r,i)=>`<details ${i===0?'open':''} class="ex"><summary><span>Week of ${fmtDate(r.week)}</span><span class="r">${r.weight?kg1(r.weight)+'kg':''}</span></summary>${reviewSummary(r)}</details>`).join('')}
  </section>
  <section class="card">
    <div class="sec-title">Weigh-in history</div>
    ${ws.length?'':`<p class="small muted">Your starting weight of ${kg1(s.startWeight)}kg is set. Log your first morning weigh-in above.</p>`}<div>${[...ws].reverse().map(w=>`<div class="item"><div class="grow"><div class="t">${kg1(w.kg)} kg</div><div class="s">${fmtDay(w.date)}</div></div><button class="btn small ghost" data-action="delWeight" data-id="${w.id}" aria-label="Delete weigh-in">${ICON.close.replace('<svg','<svg width="14" height="14"')}</button></div>`).join('')}</div>
  </section>`;
}

/* ---------- Weekly review ---------- */
function openReview(){
  const k=todayKey();
  const wkey=reviewWeekKey(k)||weekStart(k);
  const st=weekStats(wkey), existing=S.reviews.find(r=>r.week===wkey)||{};
  const scale=(name,lo,hi,val)=>`<div class="field"><label>${{nutrition:'How did nutrition go?',snacking:'How did afternoon snacking go?',energy:'Energy levels',sleep:'Sleep quality'}[name]}</label><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${name}" id="rv_${name}_${n}" value="${n}" ${+val===n?'checked':''}><span>${n}</span></label>`).join('')}</div><div class="scale-ends"><span>${lo}</span><span>${hi}</span></div></div>`;
  openSheet(`<form data-form="review" class="stack" autocomplete="off">
    <div><div class="eyebrow">Week of ${fmtDate(wkey)}</div><div class="sec-title" style="margin-top:4px">Weekly review</div></div>
    <input type="hidden" name="week" value="${wkey}">
    <div class="grid2">
      <div class="field"><label for="rv_w">Current weight (kg)</label><input class="input" id="rv_w" name="weight" inputmode="decimal" data-nofocus value="${existing.weight??kg1(currentWeight())}"></div>
      <div class="field"><label for="rv_s">Avg daily steps</label><input class="input" id="rv_s" name="steps" inputmode="numeric" value="${existing.steps??(st.stepsAvg?Math.round(st.stepsAvg):'')}"></div>
    </div>
    <div class="field"><label for="rv_wo">Workouts completed</label><input class="input" id="rv_wo" name="workouts" inputmode="numeric" value="${existing.workouts??st.strength}"></div>
    <p class="tiny faint">Prefilled from what you logged this week. Change anything that's off.</p>
    ${scale('nutrition','Rough','Spot on',existing.nutrition)}
    ${scale('snacking','Grazed all day','In control',existing.snacking)}
    ${scale('energy','Running on empty','Full of beans',existing.energy)}
    ${scale('sleep','Barely slept','Well rested',existing.sleep)}
    <div class="field"><label for="rv_win">Biggest win of the week</label><textarea class="input" id="rv_win" name="win" maxlength="300">${esc(existing.win||'')}</textarea></div>
    <div class="field"><label for="rv_ch">Biggest challenge</label><textarea class="input" id="rv_ch" name="challenge" maxlength="300">${esc(existing.challenge||'')}</textarea></div>
    <button class="btn primary block" type="submit">See my summary</button>
  </form>`);
}
function reviewSummary(r){
  const s=S.settings, st=weekStats(r.week);
  const prior=[...S.reviews].filter(x=>x.week<r.week&&x.weight).sort((a,b)=>a.week<b.week?1:-1)[0];
  const base=prior?prior.weight:s.startWeight;
  const ch=r.weight?r.weight-base:null;
  const lines=[];
  if(ch!==null) lines.push(ch<=-0.05?`Weight: down ${kg1(-ch)}kg ${prior?'since last review':'since the start'}. ${ch<-1.2&&prior?'That\'s quick. Make sure you\'re eating enough to train well.':'Right on track.'}`:ch<0.3?`Weight: about level ${prior?'with last week':'with the start'}. Normal. Fluctuations hide progress week to week.`:`Weight: up ${kg1(ch)}kg. Probably water, salt or a heavier weekend. The trend over 3–4 weeks is what counts.`);
  lines.push(`Habits: ${Math.round(st.habitPct*100)}% of daily habits ticked. ${st.habitPct>=0.7?'Very consistent.':st.habitPct>=0.5?'Solid base to build on.':'Room to build, and that\'s fine.'}`);
  const wo=+r.workouts||0;
  lines.push(`Workouts: ${wo} of ${s.workoutsPerWeek} strength sessions. ${wo>=s.workoutsPerWeek?'Target hit.':wo>0?'Some done is better than none.':'This week didn\'t happen. Next week can.'}`);
  if(r.steps) lines.push(`Steps: averaging ${n0(r.steps)} a day against ${n0(s.steps)}. ${+r.steps>=s.steps?'Brilliant.':+r.steps>=s.steps*0.8?'Close.':'One extra walk a day closes the gap.'}`);
  if(st.sleepAvg) lines.push(`Sleep: averaging ${fmtHrs(st.sleepAvg)} a night across ${st.sleepDays} night${st.sleepDays===1?'':'s'} recorded.`);
  const cis=st.days.map(d=>getDay(d).checkin).filter(Boolean);
  if(cis.length){const fa=avg(cis.map(c=>c.feeling));lines.push(`How you felt: ${FEEL[Math.round(fa)].toLowerCase()} on average across ${cis.length} check-in${cis.length===1?'':'s'}${cis.some(c=>c.wakes>=2)?`, with ${cis.filter(c=>c.wakes>=2).length} broken night${cis.filter(c=>c.wakes>=2).length===1?'':'s'}`:''}.`)}
  const notes=st.days.map(d=>[d,getDay(d).checkin]).filter(([d,c])=>c&&c.note);
  lines.push(st.logged?`Nutrition: food logged on ${st.logged} day${st.logged===1?'':'s'}; within your calorie target on ${st.onTarget}, protein target hit on ${st.protHit}.${r.nutrition?` You rated it ${r.nutrition}/5.`:''}`:`Nutrition: ${r.nutrition?`you rated it ${r.nutrition}/5. `:''}Logging food on a few days would make this summary sharper.`);
  // recommendation
  const recs=[];
  const sn=+r.snacking||3, sl=+r.sleep||3, en=+r.energy||3, nu=+r.nutrition||3;
  if(sl<=2) recs.push([5,'Protect sleep this week. On rough nights, swap strength for a walk and get to bed by 9:30 when you can.']);
  if(sn<=2) recs.push([4.5,'Plan your 3pm: put a protein snack in the fridge and a 10-minute walk in your calendar for 2:45.']);
  if(wo<s.workoutsPerWeek) recs.push([4,`Book your strength sessions like meetings, ${s.workoutsPerWeek>=3?'Mon, Wed and Fri':'Mon and Thu'} at 6:30am, and lay your kit out the night before.`]);
  if(r.steps&&+r.steps<s.steps*0.85) recs.push([3.5,'Add a 15-minute walk after lunch. That\'s roughly 1,800 extra steps a day.']);
  if(st.logged>=3&&st.protHit<st.logged/2) recs.push([3,'Add protein at breakfast: eggs or Greek yoghurt. It makes the afternoon easier too.']);
  if(nu<=2) recs.push([3,'Pick two go-to lunches and repeat them. Fewer decisions, fewer slips.']);
  if(en<=2) recs.push([2.5,'Low energy: check water first, aim for 2.5L, and get outside in daylight before 10am.']);
  if(!recs.length) recs.push([1,s.rounds<3?'Everything\'s ticking. Next step: try 3 rounds on one workout this week.':s.workoutsPerWeek<3?'Everything\'s ticking. When you\'re ready, build to three strength sessions.':'Everything\'s ticking. Keep the same plan. Boring is working.']);
  recs.sort((a,b)=>b[0]-a[0]);
  // calorie adjustment
  let adj='';
  const withW=[...S.reviews].filter(x=>x.weight&&x.week<=r.week).sort((a,b)=>a.week<b.week?-1:1);
  if(withW.length>=3){const first=withW[withW.length-3],last=withW[withW.length-1];const per=(first.weight-last.weight)/Math.max(1,daysBetween(first.week,last.week)/7);
    if(per<0.2) adj=`Weight has been fairly flat for three reviews. If your logging is accurate, consider trimming your calorie target by about 150 kcal.`;
    else if(per>1) adj=`You're losing over 1kg a week. Consider adding about 150 kcal so energy and training stay good.`;}
  return `<div class="stack" style="padding-bottom:14px">
    <ul class="summary">${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
    ${r.win?`<p class="small"><b>Win:</b> <span class="muted">${esc(r.win)}</span></p>`:''}
    ${r.challenge?`<p class="small"><b>Challenge:</b> <span class="muted">${esc(r.challenge)}</span></p>`:''}
    ${notes.length?`<div class="stack" style="gap:4px"><span class="eyebrow">Your check-in notes</span>${notes.map(([d,c])=>`<p class="small"><b>${DOW[parseDk(d).getDay()].slice(0,3)}:</b> <span class="muted">${esc(c.note)}</span></p>`).join('')}</div>`:''}
    <div class="rec"><div class="eyebrow" style="color:var(--green-hi);margin-bottom:4px">Focus for next week</div>${esc(recs[0][1])}</div>
    ${adj?`<div class="callout">${esc(adj)} Calorie needs are estimates, so adjust gradually.</div>`:''}
  </div>`;
}

/* ---------- Settings & data ---------- */

  openSheet(`<form data-form="settings" class="stack" autocomplete="off">
    <div class="sec-title">Targets</div>
    <div class="callout">Your estimated maintenance is around <b style="color:var(--fg)">${n0(maint)} kcal</b> (Mifflin-St Jeor formula, lightly active). A target of ${n0(s.kcal)} gives a deficit of roughly ${n0(maint-s.kcal)} kcal a day, about ${kg1((maint-s.kcal)*7/7700)}kg a week. These are estimates, not medical advice. Adjust after a few weekly reviews.</div>
    <div class="grid2">
      <div class="field"><label for="s_kcal">Calories / day</label><input class="input" id="s_kcal" name="kcal" inputmode="numeric" data-nofocus value="${s.kcal}"></div>
      <div class="field"><label for="s_p">Protein (g)</label><input class="input" id="s_p" name="protein" inputmode="numeric" value="${s.protein}"></div>

      <div class="field"><label for="s_steps">Steps / day</label><input class="input" id="s_steps" name="steps" inputmode="numeric" value="${s.steps}"></div>
      <div class="field"><label for="s_target">Target weight (kg)</label><input class="input" id="s_target" name="target" inputmode="decimal" value="${s.target}"></div>
      <div class="field"><label for="s_stretch">Stretch target (kg)</label><input class="input" id="s_stretch" name="stretch" inputmode="decimal" value="${s.stretch}"></div>

    <label class="check" style="border:0"><input type="checkbox" id="s_rundown" name="rundown" ${s.rundown?'checked':''}><span class="box">${TICK}</span><span class="lbl">Offer a morning check-in and daily rundown</span></label>
    <div class="sec-title" style="margin-top:6px">Programme</div>
    <div class="grid2">
      <div class="field"><label for="s_start">Start date</label><input class="input" type="date" id="s_start" name="startDate" value="${s.startDate}"></div>

      <div class="field"><label for="s_h">Height (cm)</label><input class="input" id="s_h" name="heightCm" inputmode="decimal" value="${s.heightCm}"></div>
    </div>
    <button class="btn primary block" type="submit">Save targets</button>

  <div class="stack">
